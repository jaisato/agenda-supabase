name: CI

on:
  push:
    # Solo master: las ramas se prueban con el evento pull_request de su PR. Con los push de las
    # ramas también, cada push a una rama con la PR abierta lanzaría el CI dos veces.
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, tests y npm audit
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx ng build

      - run: npx ng test --watch=false

      - run: npm audit --audit-level=low

  # Prueba la base de datos de Supabase (supabase/) con el stack local en Docker. Corre en
  # paralelo con build: no comparten nada.
  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-latest
    # Arrancar el stack y probar tarda unos minutos. Sin límite, un arranque colgado ocuparía el
    # runner hasta las 6 horas que GitHub da por defecto a un job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # pgTAP solo necesita Postgres. Realtime, Storage y el resto existen como esquema; sus
      # contenedores no hacen falta y el arranque gasta menos memoria.
      - run: npx supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio

      # Aplica las migraciones y supabase/seed.sql sobre una base limpia.
      - run: npx supabase db reset

      # pgTAP: supabase/tests/*.sql.
      - run: npx supabase test db

      - run: npx supabase db lint --fail-on warning

      # database.types.ts es un fichero generado: si el esquema cambia y el fichero no, el diff falla.
      - run: npx supabase gen types --lang typescript -s public > src/app/supabase/database.types.ts && git diff --exit-code -- src/app/supabase/database.types.ts

  # Entra con la cuenta demo y comprueba que la lista pinta un contacto. El stack es el mismo que
  # el de «Base de datos»: Auth y la Data API sí arrancan; Realtime y Storage no hacen falta aquí.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,studio

      - run: npx supabase db reset

      - name: Sembrar la demo
        run: |
          eval "$(npx supabase status -o env | grep -E '^(API_URL|SERVICE_ROLE_KEY|SECRET_KEY)=')"
          SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="${SECRET_KEY:-$SERVICE_ROLE_KEY}" npm run seed:demo

      - run: npm run e2e
