name: Keep alive

# El plan gratuito de Supabase pausa el proyecto tras una semana sin actividad. Una petición
# semanal a su API (los lunes a las 06:17 UTC) lo mantiene despierto. También se puede lanzar a
# mano desde la pestaña Actions.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Sin acceso al repositorio: solo hace una petición HTTP.
permissions: {}

jobs:
  ping:
    name: Petición a Supabase
    runs-on: ubuntu-latest
    steps:
      # La publishable key es pública por diseño (viaja en el JS del navegador): no es un secreto.
      # Bloque literal (|): el «: » de la cabecera apikey rompería un escalar plano de YAML.
      - run: |
          curl -fsS -H "apikey: sb_publishable_Dn4i5OCgsn8KRuXrVX_70A_oXKbs-Bc" https://zckmejrnscenxwiqykkh.supabase.co/auth/v1/health
