# Dependabot: npm cada semana (con todo @angular/* en una sola PR) y las acciones de GitHub cada mes.
#
# - Las versiones mayores de Angular no llegan por aquí: se hacen con `ng update`, que además
#   ejecuta las migraciones de código.
# - TypeScript solo recibe parches: cada versión de Angular admite un rango menor concreto
#   (Angular 22 exige `>=6.0 <6.1`), así que las menores llegan junto con `ng update`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Tampoco las mayores que se salen de los peer de Angular 22: npm las instala con el aviso
      # «ERESOLVE overriding peer dependency», pero Angular no las admite. @angular/build pide
      # vitest ^4.0.8 || ^5.0.0 y tslib ^2.3.0, y @angular/core, rxjs ^6.5.3 || ^7.4.0.
      # Llegarán con el `ng update` que las admita. jsdom no se limita: no es peer de
      # @angular/build y vitest acepta cualquier versión.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: tslib
        update-types: ["version-update:semver-major"]
      - dependency-name: rxjs
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
