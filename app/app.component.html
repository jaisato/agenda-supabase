<div class="container">
    <header>
        <h1>Agenda</h1>
    </header>
    <section>
        <!-- Formulario de alta -->
        <formulario-contacto (nuevoContacto)="agregarContacto($event)"></formulario-contacto>
        <lista-contactos [contactos]="listaContactos" (contactoSeleccionado)="verDetallesContacto($event)">
        </lista-contactos>
        <detalles-contacto [contacto]="contactoSeleccionado" (eliminar)="eliminarContacto($event)">
        </detalles-contacto>
    </section>
</div>
