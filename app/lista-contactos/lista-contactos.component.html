<!-- Boton de ordenacion -->
<button class="icono" (click)="cambiarOrden()">
    <i class="fa" 
    [ngClass]="{
        'fa-sort-alpha-asc': sentidoOrdenacion !== 'asc',
        'fa-sort-alpha-desc': sentidoOrdenacion === 'asc'
        }"
    aria-hidden="true"></i>
</button>
<ul>
    <!-- Con la directiva 'ngFor' iteramos por una colección y replicamos el elemento HTML por cada item en la lista -->
    <li *ngFor="let contacto of (contactos | SortContacts :sentidoOrdenacion)" (click)="notificarContactoSeleccionado(contacto)">
        {{ contacto.nombre }} {{ contacto.apellidos }}
        <!--
        <button (click)="notificarEliminacion(contacto)">Eliminar contacto</button>
        -->
    </li>
</ul>
