<nav>
  <ul>
    @if (auth.usuario(); as usuario) {
      <li>
        <a routerLink="/mis-contactos" routerLinkActive="seleccionada">Mis Contactos</a>
      </li>
      <li>
        <a routerLink="/nuevo-contacto" routerLinkActive="seleccionada">Nuevo Contacto</a>
      </li>
      <li>
        <a routerLink="/perfil" routerLinkActive="seleccionada">Perfil</a>
      </li>
      <li class="sesion">
        <span class="email">
          @if (urlAvatar(); as url) {
            <img class="avatar" [src]="url" alt="" referrerpolicy="no-referrer" />
          }
          {{ nombreVisible() }}
        </span>
        <button type="button" (click)="salir()">Salir</button>
      </li>
    } @else {
      <li>
        <a routerLink="/entrar" routerLinkActive="seleccionada">Entrar</a>
      </li>
    }
  </ul>
</nav>
