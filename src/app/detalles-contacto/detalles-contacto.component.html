@if (contacto(); as contacto) {
  <div>
    <!-- Nombre contacto -->
    <h5>{{ contacto.nombre }} {{ contacto.apellidos }}</h5>
    <hr />
    <!-- Botones para ver perfiles en redes sociales -->
    <button class="icono" (click)="notificarNavegacionFacebook()">
      <i class="fa fa-facebook-square" aria-hidden="true"></i>
    </button>
    <button class="icono" (click)="notificarNavegacionTwitter()">
      <i class="fa fa-twitter-square" aria-hidden="true"></i>
    </button>
    <hr />
    <div>{{ contacto.telefono }} | {{ contacto.email }}</div>
    <!-- Acciones según el rol: editar (propietario y editor), compartir y eliminar (propietario) y
         dejar de ver (quien lo tiene compartido) -->
    <div class="acciones">
      @if (contacto.rol !== 'lector') {
        <button type="button" class="u-full-width" (click)="notificarEdicion(contacto)">
          Editar
        </button>
      }
      @if (contacto.rol === 'propietario') {
        <button type="button" class="u-full-width" (click)="notificarComparticion(contacto)">
          Compartir
        </button>
        <button
          type="button"
          class="u-full-width boton-eliminar"
          (click)="notificarEliminacion(contacto)"
        >
          Eliminar contacto
        </button>
      } @else {
        <button type="button" class="u-full-width" (click)="notificarDejarDeVer(contacto)">
          Dejar de ver
        </button>
      }
    </div>
  </div>
}
