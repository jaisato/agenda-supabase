<div class="row">
  <div class="offset-by-three six columns">
    <!-- Cada maxlength es el del check de su columna en la base de datos: sin él, un texto más
         largo llegaría hasta Postgres y volvería como un error 23514 -->
    <form #formContacto="ngForm" (ngSubmit)="notificarGuardado(formContacto)" novalidate>
      <div>
        <label for="nombre">Nombre</label>
        <input
          class="u-full-width"
          type="text"
          id="nombre"
          [ngModel]="inicial()?.nombre ?? ''"
          name="nombre"
          #fieldNombre="ngModel"
          placeholder="Ej. Tim"
          required
          maxlength="100"
        />
        @if (fieldNombre.touched && fieldNombre.invalid) {
          <div class="msg-error">El nombre es un campo obligatorio</div>
        }
      </div>

      <div>
        <label for="apellidos">Apellidos</label>
        <input
          class="u-full-width"
          id="apellidos"
          name="apellidos"
          #fieldApellidos="ngModel"
          type="text"
          placeholder="Ej. Cook"
          [ngModel]="inicial()?.apellidos ?? ''"
          required
          maxlength="100"
        />
        @if (fieldApellidos.touched && fieldApellidos.invalid) {
          <div class="msg-error">El campo apellidos es obligatorio</div>
        }
      </div>

      <div>
        <label for="email">Email</label>
        <input
          class="u-full-width"
          id="email"
          name="email"
          type="text"
          placeholder="Ej. tim.cook@apple.com"
          [ngModel]="inicial()?.email ?? ''"
          required
          maxlength="254"
        />
      </div>

      <div>
        <label for="telefono">Teléfono</label>
        <input
          class="u-full-width"
          id="telefono"
          name="telefono"
          type="text"
          placeholder="Ej. 555-123456"
          [ngModel]="inicial()?.telefono ?? ''"
          required
          maxlength="30"
        />
      </div>

      <div>
        <label for="facebook">Facebook</label>
        <input
          class="u-full-width"
          id="facebook"
          name="facebook"
          type="text"
          placeholder="Ej. tim.cook"
          [ngModel]="inicial()?.facebook ?? ''"
          required
          maxlength="100"
        />
      </div>

      <div>
        <label for="twitter">Twitter</label>
        <input
          class="u-full-width"
          id="twitter"
          name="twitter"
          type="text"
          placeholder="Ej. @timcook"
          [ngModel]="inicial()?.twitter ?? ''"
          required
          maxlength="100"
        />
      </div>

      <div>
        <button
          type="submit"
          class="button-primary u-full-width"
          [disabled]="formContacto.invalid || enviando()"
        >
          {{ textoBoton() }}
        </button>
      </div>
    </form>
  </div>
</div>
